name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC x64 (Visual Studio 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild multitool.sln /p:Configuration=Release /p:Platform=x64 /m /nologo
      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-msvc-x64
          path: bin/x64/Release/multi-tool.exe

  mingw:
    name: MinGW-w64 (cross-compile on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 make
      - name: Build
        run: make
      - name: Check i18n tables are up to date
        run: |
          python3 tools/gen_i18n.py
          git diff --exit-code -- src/i18n
      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-mingw-x64
          path: multi-tool.exe
